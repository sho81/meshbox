<div style="width: 96%; max-width: 170ch; margin: 20px auto;">

</div>

<script>
(function () {
    var f = document.getElementById("neighborsFrame");
    function fit() {
        try {
            f.style.height = (f.contentDocument.documentElement.scrollHeight + 4) + "px";
        } catch (e) {}
    }
    window.addEventListener("load", function () { fit(); setTimeout(fit, 300); });
    setInterval(fit, 65000);   // re-fit after each cron update while the page stays open
})();
</script>
