# mesh dashboard on extra boxes: static page under /mesh/ + proxies for the
# loopback service (mesh-time-sync.service, port 8090): /settime (F24) and
# /keymap-update (F31 node lookup button).
# Install as /etc/lighttpd/conf-available/95-mesh-dashboard.conf, then
# lighty-enable-mod proxy && lighty-enable-mod mesh-dashboard.
alias.url += ( "/mesh" => "/var/www/mesh" )
$HTTP["url"] =~ "^/(settime|keymap-update)" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8090 ) ) )
}
